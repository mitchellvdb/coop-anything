; Darkest Dungeon co-op framework settings.

[net]
; off   = plain single player
; host  = (later) host a co-op game
; guest = (later) join a co-op game
role=off
port=27360
host=
; The session password, once co-op exists. Never use a password you use anywhere else.
password=

[coop]
; Campaigns that may be played in co-op, as their position in the game's campaign list (1 = top ... 9 = bottom).
; One or more, separated by commas, e.g.  3   or   3,7
; Every other campaign is always plain single player. Anything that is not a list of 1..9 switches co-op off.
coop_slots=3

[log]
; 1 = also list every game address in ddcoop-fw.log
verbose=0
